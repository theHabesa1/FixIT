name: Acquire Unity activation file

# Run this ONCE (Actions tab -> this workflow -> "Run workflow") to generate a
# manual activation request file (.alf) for a free Personal license. Then:
#   1. Download the "Manual Activation File" artifact from this run.
#   2. Go to https://license.unity3d.com/manual and upload the .alf.
#   3. Download the resulting .ulf license file.
#   4. Repo Settings -> Secrets and variables -> Actions -> New secret
#      named UNITY_LICENSE, paste the entire .ulf contents.
#   5. Re-run the "Build (macOS)" workflow.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
